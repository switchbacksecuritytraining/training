<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchback Security Training</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<meta name="description" content="Switchback Security Training — an announcement is coming tomorrow.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@600;700&amp;family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* Masthead lockup is two lines; below 36px the
     descriptor stops reading. Overrides assets/site.css. */
  .logo__img{height:36px;width:auto;display:block}

  /* Single-column hero now that there is no image beside it. */
  .hero__grid { display: block; }
  .hero h1 { font-size: clamp(2rem, 3.6vw, 2.75rem); max-width: 22ch; }
  .notice { max-width: 46ch; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap masthead__inner">
    <a class="logo" href="https://switchbacksecuritytraining.com"><img src="images/switchback-masthead.svg" alt="Switchback Security Training" class="logo__img"></a>
  </div>
</header>

<main id="main">

  <section class="hero">
    <div class="wrap hero__grid">
      <div>
        <h1>An announcement is coming tomorrow.</h1>
        <p class="hero__lede notice">
          Questions in the meantime:
          <a href="mailto:contact@switchbacksecuritytraining.com">contact@switchbacksecuritytraining.com</a>
        </p>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap foot__grid">
    <div>
      <img src="images/switchback_gradient_white_400.jpg" alt="Switchback Security Training" class="foot__logo">
      <p><a href="mailto:contact@switchbacksecuritytraining.com">contact@switchbacksecuritytraining.com</a></p>
    </div>
  </div>
</footer>

</body>
</html>
